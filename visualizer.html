<!--
  Local Pokémon TCG battle visualizer — board + step navigation.

  Renders the battle board as stylized cards drawn ENTIRELY from local trace data — the "graphic
  board" toggle (on by default; gMon/gCard/gStack/gHand/gSide/gBoard below) lays out both sides'
  Active + bench, the shared stadium, zone-count stacks, and the hero's hand, with HP bars, attached-
  energy pips, per-Pokémon attacks (name + damage, effect text on the Active), damage,
  status, evo/tool/new badges, element-colored cards (by header.cards[id].element), and a face-up
  discard top card. Hovering ANY card (either board, or the hero's hand) shows a full-card tooltip
  (`cardTip`): static data from header.cards — type/subtype, weakness/resistance/retreat, abilities or
  trainer rules text, and every attack's cost/damage/text — plus, for a Pokémon in play, its live
  instance (current HP + damage, attached energy, tools, evolution stack). With the graphic board on,
  `#wrap` gets the `boardfocus` class → a wider two-column
  layout (large board on the left, decision + obs panels in the rail beside it). No card art and NO
  network are needed for it. A "graphic board" checkbox flips back to the compact text board (side()/
  mon()). The one remaining EXTERNAL, opt-in action is the "🎮 Graphical replay" button, which POSTs
  the reconstructed visualize_data() array to the Heroz renderer (ptcgvis.heroz.jp) for the real card
  artwork — the same path kaggle_notebook_to_view_battles.py uses; it is no longer the only way to see
  graphics. Everything else (both boards, fog toggle, feature panels) stays local. Open this file in a
  browser and load a trace.json produced by `record_battle.py`. Steps through one recorded battle so
  you can stand in the model's shoes at each decision. A turn-labeled progress scrubber (`#scrub` /
  renderScrub, in the sticky bar) gives a click-to-jump tick per visible step so you can reach any turn
  (e.g. the last) in one click; Home/End jump to the ends. The "only real decisions" filter (default on;
  `isReal`) keeps EVERY hero move — including forced switches/placements, so the board never teleports —
  plus every discretionary (`select.learnable`) node, and hides only the opponent's forced bookkeeping.

  Data contract (see record_battle.py): trace = { header:{...,cards:{id:{name,hp,type,element,
  attacks:[{name,damage,text,cost?}], skills?,weakness?,resistance?,retreat?,subtype?,evolvesFrom?}}},
  steps:[ {idx,turn,actor_seat,actor_name,hero_move, select:{prompt,type_name,minCount,maxCount,
  policy,learnable,...}, options:[{label,chosen}], action:[i...], logs:[{kind,...}], model:null|{...},
  features:{state:[...]}, obs:{...fog...}, god:{...full board...} } ], final_god:{...} }.

  `step.model` (per-option probs + critic value) renders as the option bars + value read below when the
  actor is an SB3 model; `step.features.state` feeds the labeled feature panel; both are optional and the
  UI degrades gracefully when absent (rule-based actors, or older traces without `element`).
-->
<style>

    --dim:#98a0b0; --accent:#5aa0ff; --good:#57c07a; --bad:#e0664a; --chosen:#2d5a3a; --warn:#e6c84a;

  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }

  #wrap.boardfocus .gmon .atk { font-size:11px; }

  #wrap.boardfocus .gstadium .gcard { flex-basis:108px; }
  /* full-card hover tooltip: one reusable floating node, built from header.cards[id] (+ the live god

  #tip .trow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:2px 0; }
  #tip .tlbl { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }

<div id="bar">
  <input type="file" id="file" accept=".json,application/json">
  <button id="prev">◀ Prev</button>
  <span id="counter">— / —</span>
  <button id="next">Next ▶</button>
  <label class="tog"><input type="checkbox" id="reveal"> reveal hidden info</label>
  <label class="tog"><input type="checkbox" id="gfx" checked> graphic board</label>
  <label class="tog" title="Hide only the opponent's forced/bookkeeping steps. Every hero decision (even forced switches/placements) and every discretionary node stays, so the board never jumps."><input type="checkbox" id="onlyReal" checked> only real decisions</label>
  <label class="tog"><input type="checkbox" id="heroOnly"> hero (p0) moves only</label>
  <button id="graphical" disabled style="margin-left:auto"
    title="Open this game as real graphics in the Heroz visualizer — opens a new tab and sends the board data to ptcgvis.heroz.jp">🎮 Graphical replay ↗</button>
  <div id="scrub"></div>
</div>

<div id="wrap">
  <div id="empty">Load a <code>trace.json</code> (from <code>record_battle.py</code>) to begin.</div>
</div>

<script>
"use strict";
const EN = { // EnergyType -> {letter, color}
  0:["C","#d9d4c8"],1:["G","#6abe6a"],2:["R","#e05a3a"],3:["W","#4aa3e0"],4:["L","#e6c84a"],
  5:["P","#b06ac0"],6:["F","#c0803a"],7:["D","#5a5a6a"],8:["M","#9aa3b0"],9:["N","#c0a63a"],
  10:["*","#b0b0b0"],11:["TR","#8a4a6a"] };
const CAT = { // CardType category -> card color (Pokémon element type isn't in the data, only category)
  POKEMON:"#6f8fb0", ITEM:"#3fa9a0", SUPPORTER:"#e0894a", STADIUM:"#5aa06a", TOOL:"#9a6ac0",
  BASIC_ENERGY:"#c9b458", SPECIAL_ENERGY:"#b58a4a" };
const catColor = t => CAT[t] || "#7a8290";
// A card's board color: element color for a Pokémon (as gMon's stripe — trainers/energy also carry
// an element field, so gate on type), else its CardType-category color (as gCard). null when the id
// is absent (options with no card, e.g. End/Yes/No/Number).
const cardColor = cid => {
  if(cid==null) return null;
  const cd=TRACE.header.cards[String(cid)]||{};
  return (cd.type==="POKEMON"&&cd.element!=null&&EN[cd.element])?EN[cd.element][1]:catColor(cd.type||"");
};
let TRACE=null, STEPS=[], cur=0, SESSION=null, gameIdx=0;
let LIVE={}, tipKey=null;   // LIVE = serial -> live god Pokémon (rebuilt each render); tipKey dedups tip rebuilds

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf=id => (TRACE.header.cards[String(id)]||{}).name || ("#"+id);

$("#file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ try{ load(JSON.parse(ev.target.result)); }catch(err){ alert("Bad JSON: "+err); } };
  r.readAsText(f);
});
// A file may be a single-game trace {header,steps,...} or a session {session,games:[trace...]}.
function load(data){
  if(data && data.games){ SESSION=data; gameIdx=0; TRACE=data.games[0]; }
  else { SESSION=null; TRACE=data; }
  STEPS=(TRACE&&TRACE.steps)||[]; cur=0; if(!visible(cur)) cur=nextVisible(0,1); render();
}
function pickGame(k){ if(!SESSION) return; gameIdx=+k; TRACE=SESSION.games[gameIdx];
  STEPS=TRACE.steps||[]; cur=0; if(!visible(cur)) cur=nextVisible(0,1); render(); }

// -- stepping (respects the "only real decisions" / "hero only" filters) --
// A step is a "real decision" if it's a HERO move (any — including forced switches/placements, so the
// hero board never teleports) OR a discretionary node the policy is allowed to decide (select.learnable,
// the SUPERSET of select.policy — keeps the model's multi/optional decisions like a tutor, whose probs
// are recorded but which select.policy would wrongly drop). Opponent forced/bookkeeping steps are hidden.
function isReal(s){ return s.hero_move || !!(s.select && s.select.learnable); }
function visible(i){
  const s=STEPS[i]; if(!s) return false;
  if($("#heroOnly").checked && !s.hero_move) return false;
  if($("#onlyReal").checked && !isReal(s)) return false;
  return true;
}
function nextVisible(from,dir){
  for(let i=from; i>=0 && i<STEPS.length; i+=dir) if(visible(i)) return i;
  // nothing matches in that direction: fall back to any step so the view never goes blank
  for(let i=from; i>=0 && i<STEPS.length; i+=dir) return i;
  return Math.max(0,Math.min(STEPS.length-1,from));
}
$("#prev").onclick=()=>{ if(!STEPS.length) return; cur=nextVisible(cur-1,-1); render(); };
$("#next").onclick=()=>{ if(!STEPS.length) return; cur=nextVisible(cur+1,1); render(); };
function jumpTo(i){ if(STEPS.length){ cur=Math.max(0,Math.min(STEPS.length-1,i)); render(); } }
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){ $("#prev").click(); } else if(e.key==="ArrowRight"){ $("#next").click(); }
  else if(e.key==="Home"){ if(STEPS.length) jumpTo(nextVisible(0,1)); }
  else if(e.key==="End"){ if(STEPS.length) jumpTo(nextVisible(STEPS.length-1,-1)); }
});
for(const id of ["reveal","onlyReal","heroOnly","gfx"]) $("#"+id).addEventListener("change",()=>{
  if(id!=="reveal" && !visible(cur)) cur=nextVisible(cur,1); render(); });

// -- graphical replay (the ONE external request; opt-in, only on click) --
// record_battle stores each raw visualize_data() entry verbatim in step.god (terminal in final_god),
// so we can rebuild the exact god-view array the Heroz renderer wants and POST it there in a new tab,
// augmenting each entry with obs/action like kaggle_notebook_to_view_battles.py.
const HEROZ_URL="https://ptcgvis.heroz.jp/Visualizer/Replay/0";
function openGraphical(){
  if(!TRACE) return;
  const vis=STEPS.filter(s=>s.god).map(s=>({...s.god, obs:s.obs, action:[s.action, s.action]}));
  if(TRACE.final_god) vis.push(TRACE.final_god);
  const form=Object.assign(document.createElement("form"),{method:"POST",action:HEROZ_URL,target:"_blank"});
  const inp=Object.assign(document.createElement("input"),{type:"hidden",name:"json",value:JSON.stringify(vis)});
  form.appendChild(inp); document.body.appendChild(form); form.submit(); form.remove();
}
$("#graphical").onclick=openGraphical;

// -- rendering --
function hpBar(hp,max){ const f=max?Math.max(0,hp/max):0; const c=f>.5?"#57c07a":f>.25?"#e6c84a":"#e0664a";
  return `<div class="hpbar"><i style="width:${(f*100).toFixed(0)}%;background:${c}"></i></div>`; }
function energies(list){ if(!list||!list.length) return "";
  return `<div class="en">`+list.map(e=>{const[l,c]=EN[e]||["?","#888"];
    return `<b style="background:${c}">${l}</b>`;}).join("")+`</div>`; }

// -- full-card hover tooltip (one node, driven by data-cid / data-serial on any board card) --
// Builds full-card HTML from header.cards[cid] plus the optional live god Pokémon (attached energy,
// damage, evolution stack). EVERY section guards on field presence, so OLD traces — which lack the
// enriched keys (skills/weakness/subtype/…, some even lack `element`) — degrade to name/hp/attacks.
const tip=document.createElement("div"); tip.id="tip"; document.body.appendChild(tip);
function cardTip(cid, live){
  const cd=TRACE.header.cards[String(cid)]||{}, cat=(cd.type||"card").replace("_"," ").toLowerCase();
  let h=`<div class="tnm"><span>${esc(cd.name||nameOf(cid))}</span>${cd.hp?`<span>${cd.hp} HP</span>`:""}</div>`;
  // element pip only where an energy type is meaningful (Pokémon + energy cards; trainers default to colorless)
  const elPip=(cd.element!=null&&(cd.type==="POKEMON"||(cd.type||"").endsWith("ENERGY")))?energies([cd.element]):"";
  h+=`<div class="tmeta">${esc(cat)}${cd.subtype?" · "+esc(cd.subtype):""}${elPip}</div>`;
  if(cd.weakness!=null||cd.resistance!=null||cd.retreat!=null){
    let d="";
    if(cd.weakness!=null)   d+=`<span class="tlbl">weak</span>${energies([cd.weakness])}`;
    if(cd.resistance!=null) d+=`<span class="tlbl">resist</span>${energies([cd.resistance])}`;
    if(cd.retreat!=null)    d+=`<span class="tlbl">retreat</span><span>${cd.retreat}</span>`;
    h+=`<div class="trow">${d}</div>`;
  }
  const names=l=>esc((l||[]).map(t=>t.name||nameOf(t.id)).join(", "));
  if(live){
    const dmg=(live.maxHp||0)-(live.hp||0);
    h+=`<div class="tsec"><div class="trow"><span class="tlbl">in play</span>`
      + `<span>${live.hp}/${live.maxHp}${dmg>0?` <span class="tdm">−${dmg}</span>`:""}</span>`
      + `${live.appearThisTurn?`<span class="tlbl">new</span>`:""}</div>`;
    if(live.energies&&live.energies.length) h+=`<div class="trow"><span class="tlbl">energy</span>${energies(live.energies)}</div>`;
    if(live.tools&&live.tools.length)       h+=`<div class="trow"><span class="tlbl">tool</span><span>${names(live.tools)}</span></div>`;
    if(live.preEvolution&&live.preEvolution.length) h+=`<div class="trow"><span class="tlbl">evolved from</span><span>${names(live.preEvolution)}</span></div>`;
    h+=`</div>`;
  } else if(cd.evolvesFrom){
    h+=`<div class="trow"><span class="tlbl">evolves from</span><span>${esc(cd.evolvesFrom)}</span></div>`;
  }
  if(cd.skills&&cd.skills.length) h+=`<div class="tsec">`+cd.skills.map(s=>
      `<div class="tsk"><b>${esc(s.name)}</b>${s.text?` <span class="tx">${esc(s.text)}</span>`:""}</div>`).join("")+`</div>`;
  if(cd.attacks&&cd.attacks.length) h+=`<div class="tsec">`+cd.attacks.map(a=>
      `<div class="tatk"><div class="trow">${a.cost?energies(a.cost):""}<span class="an">${esc(a.name)}</span>`
      + `${a.damage?`<span class="ad">${esc(String(a.damage))}</span>`:""}</div>`
      + `${a.text?`<div class="tx">${esc(a.text)}</div>`:""}</div>`).join("")+`</div>`;
  return h;
}
document.addEventListener("mousemove", e=>{
  if(!TRACE){ tip.style.display="none"; return; }
  const el=e.target.closest&&e.target.closest("[data-cid]");
  if(!el){ tip.style.display="none"; tipKey=null; return; }
  const cid=el.dataset.cid, ser=el.dataset.serial, key=cid+"|"+(ser||"");
  if(key!==tipKey){ tip.innerHTML=cardTip(+cid, ser!=null?LIVE[ser]:null); tipKey=key; tip.style.display="block"; }
  const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;   // position near the cursor, flip at the edges
  let x=e.clientX+pad, y=e.clientY+pad;
  if(x+w>innerWidth)  x=e.clientX-pad-w;
  if(y+h>innerHeight) y=e.clientY-pad-h;
  tip.style.left=Math.max(0,x)+"px"; tip.style.top=Math.max(0,y)+"px";
});

function mon(p,active){
  if(!p) return `<div class="mon ${active?"active":""}"><div class="nm empty">${active?"(no active)":"—"}</div></div>`;
  return `<div class="mon ${active?"active":""}" data-cid="${p.id}" data-serial="${p.serial}"><div class="nm">${esc(p.name||nameOf(p.id))}</div>`
    +`${hpBar(p.hp,p.maxHp)}<div class="meta">${p.hp}/${p.maxHp}${p.appearThisTurn?" ·new":""}</div>${energies(p.energies)}</div>`; }
function conds(ps){ const c=[]; if(ps.poisoned)c.push("psn");if(ps.burned)c.push("brn");if(ps.asleep)c.push("slp");
  if(ps.paralyzed)c.push("par");if(ps.confused)c.push("cnf"); return c.length?`<span class="cond">${c.join(" ")}</span>`:""; }
function hand(ps,show){
  if(show && ps.hand) return `<div class="hand">`+ps.hand.map(c=>`<span class="h" data-cid="${c.id}">${esc(c.name||nameOf(c.id))}</span>`).join("")+`</div>`;
  return `<div class="hand"><span class="h hidden">${ps.handCount} card(s) in hand</span></div>`;
}
function side(g,seat,isHero,isTurn,reveal){
  const ps=g.players[seat];
  const showHand = isHero || reveal;   // hero always sees its own hand; reveal shows the opponent's
  return `<div class="side ${isHero?"hero":""} ${isTurn?"turn":""}">
    <div class="who"><span>${isHero?"▼ HERO (p0)":"▲ OPP (p1)"} — seat ${seat}</span><span>${conds(ps)}</span></div>
    <div class="row">${mon(ps.active&&ps.active[0],true)}${ps.bench.map(b=>mon(b,false)).join("")}</div>
    <div class="counts"><span>hand <b>${ps.handCount}</b></span><span>deck <b>${ps.deckCount}</b></span>
      <span>prizes <b>${ps.prize.length}</b></span><span>discard <b>${ps.discard.length}</b></span></div>
    ${hand(ps,showHand)}
  </div>`;
}

// -- graphical board (offline; stylized cards from the same god-view data the text board uses) --
// One Pokémon as a card: name, HP bar + hp/maxHp + damage (= maxHp-hp), attached-energy pips,
// attack name(s)+damage from header.cards, and evo/tool/new badges. `isActive` = the larger slot.
function gMon(p,isActive){
  if(!p) return `<div class="gmon ${isActive?"active":""} empty"><div class="nm empty">${isActive?"(no active)":"—"}</div></div>`;
  const cd=TRACE.header.cards[String(p.id)]||{};
  const dmg=(p.maxHp||0)-(p.hp||0), frac=p.maxHp?p.hp/p.maxHp:0;
  const cls=p.hp<=0?"ko":frac<=0.25?"low":"";
  const el=cd.element, stripe=(el!=null&&EN[el])?EN[el][1]:CAT.POKEMON;   // color the card by its element
  // attack rows: name + damage; the effect text is shown inline on the Active (and in the card hover).
  const atks=(cd.attacks||[]).map(a=>{
    const ad=a.damage?`<span class="ad">${esc(String(a.damage))}</span>`:"";
    const eff=(isActive&&a.text)?`<div class="aeff">${esc(a.text)}</div>`:"";
    return `<div class="atk"><span class="an">${esc(a.name)}</span>${ad}</div>${eff}`;
  }).join("");
  const badges=[];
  if(p.appearThisTurn) badges.push(`<span class="bg new">new</span>`);
  if(p.preEvolution&&p.preEvolution.length) badges.push(`<span class="bg evo">evo</span>`);
  if(p.tools&&p.tools.length) badges.push(`<span class="bg">🔧${p.tools.length>1?p.tools.length:""}</span>`);
  return `<div class="gmon ${isActive?"active":""} ${cls}" data-cid="${p.id}" data-serial="${p.serial}">
    <div class="stripe" style="background:${stripe}"></div>
    <div class="nm">${esc(p.name||nameOf(p.id))}</div>
    ${hpBar(p.hp,p.maxHp)}
    <div class="hpv">${p.hp}/${p.maxHp}${dmg>0?` <span class="dm">−${dmg}</span>`:""}</div>
    ${energies(p.energies)}
    ${atks?`<div class="atks">${atks}</div>`:""}
    ${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
  </div>`;
}
// A trainer/energy/stadium (or hand Pokémon) as a simple card, colored by its CardType category.
function gCard(cid){
  const cd=TRACE.header.cards[String(cid)]||{}, t=cd.type||"", col=catColor(t);
  const tag=(t||"card").replace("_"," ").toLowerCase()+(t==="POKEMON"&&cd.hp?` · ${cd.hp}hp`:"");
  return `<div class="gcard" style="border-color:${col}" data-cid="${cid}">
    <div class="cbar" style="background:${col}"></div>
    <div class="cnm">${esc(cd.name||nameOf(cid))}</div>
    <div class="ctag" style="color:${col}">${esc(tag)}</div></div>`;
}
// A face-down zone: card back + count (deck / prizes). faceDown=false = a lighter (non-hidden) back.
function gStack(label,count,faceDown){
  return `<div class="gstack" title="${label}: ${count}"><div class="back ${faceDown?"":"disc"}"></div>
    <div>${label}</div><div class="scount">${count}</div></div>`;
}
// The discard pile, showing its TOP (most-recently-discarded = last) card face-up — discards are public.
function gDiscard(ps){
  const n=ps.discard.length, top=n?ps.discard[n-1]:null;
  const face=top?gCard(top.id):`<div class="back disc"></div>`;
  return `<div class="gstack" title="discard: ${n}${top?" · top: "+esc(top.name||nameOf(top.id)):""}">${face}
    <div>discard</div><div class="scount">${n}</div></div>`;
}
// Hero hand face-up; opponent hand = handCount backs unless `show` (the reveal toggle) is on.
function gHand(ps,show){
  if(show && ps.hand) return `<div class="ghand">`+ps.hand.map(c=>gCard(c.id)).join("")+`</div>`;
  return `<div class="ghand">`+Array.from({length:ps.handCount||0},()=>`<div class="gcard back" title="hidden"></div>`).join("")+`</div>`;
}
// One player's half: status/who line, prize | play-area | deck+discard, and the hand row. Hero mirrors
// the opponent vertically (active nearest the centre line, bench+hand outward).
function gSide(g,seat,isHero,isTurn,reveal){
  const ps=g.players[seat], show=isHero||reveal;
  console.assert(ps.bench.length<=ps.benchMax, "bench over benchMax");
  const bench=`<div class="grow">`+(ps.bench.length?ps.bench.map(b=>gMon(b,false)).join("")
    :`<div class="gmon empty"><div class="nm empty">bench empty</div></div>`)+`</div>`;
  const active=`<div class="grow">`+gMon(ps.active&&ps.active[0],true)+`</div>`;
  const play=`<div class="gplay">${isHero?active+bench:bench+active}</div>`;
  const core=`<div class="gcore"><div class="gprize">${gStack("prizes",ps.prize.length,true)}</div>${play}
    <div class="gstacks">${gStack("deck",ps.deckCount,true)}${gDiscard(ps)}</div></div>`;
  const who=`<div class="gwho"><span>${isHero?"▼ HERO (p0)":"▲ OPP (p1)"} — seat ${seat}</span><span>${conds(ps)}</span></div>`;
  const handRow=`<div class="ghandrow">${gHand(ps,show)}</div>`;
  return `<div class="gside ${isHero?"hero":""} ${isTurn?"turn":""}">${isHero?who+core+handRow:who+handRow+core}</div>`;
}
// Full board: opponent on top, shared stadium band centred, hero on the bottom (matches side()'s seating).
function gBoard(g,heroSeat,actorSeat,reveal){
  console.assert(g.players.length===2, "expected 2 players");
  const oppSeat=1-heroSeat;
  const stad=g.stadium&&g.stadium.length
    ? `<div class="gstadium">${gCard(g.stadium[0].id)}<div>stadium</div></div>`
    : `<div class="gstadium empty">no stadium</div>`;
  return `<div class="gboard">`
    + gSide(g,oppSeat,false,actorSeat===oppSeat,reveal)
    + `<div class="gmid">${stad}</div>`
    + gSide(g,heroSeat,true,actorSeat===heroSeat,reveal)
    + `</div>`;
}
function evClass(e){ if(e.kind==="HP_CHANGE") return e.value<0||e.putDamageCounter?"dmg":"";
  if(e.kind==="RESULT") return "ko"; if(e.kind==="COIN") return "coin"; return ""; }
function evText(e){
  switch(e.kind){
    case "HP_CHANGE": return `HP ${e.value>0?"+":""}${e.value} on ${nameOf(e.cardId)}${e.putDamageCounter?" (counter)":""}`;
    case "ATTACK": return `Attack by ${nameOf(e.cardId)}`;
    case "COIN": return `Coin: ${e.head?"HEADS":"tails"}`;
    case "DRAW": return `Draw ${nameOf(e.cardId)}`;
    case "DRAW_REVERSE": return `Opponent draws`;
    case "PLAY": return `Play ${nameOf(e.cardId)}`;
    case "ATTACH": return `Attach ${nameOf(e.cardId)} → ${nameOf(e.cardIdTarget)}`;
    case "EVOLVE": return `Evolve → ${nameOf(e.cardId)}`;
    case "SWITCH": return `Switch Pokémon`;
    case "TURN_START": return `— turn start (p${e.playerIndex}) —`;
    case "RESULT": return `RESULT: winner p${e.result} (reason ${e.reason})`;
    default: return e.kind;
  }
}
function render(){
  const wrap=$("#wrap");
  $("#graphical").disabled = !(TRACE && STEPS.length);   // enabled once a game is loaded (targets the current game)
  if(!STEPS.length){ wrap.innerHTML=`<div id="empty">No steps in this trace.</div>`; $("#counter").textContent="— / —"; $("#scrub").innerHTML=""; return; }
  const s=STEPS[cur], g=s.god&&s.god.current, sel=s.select, reveal=$("#reveal").checked;
  const h=TRACE.header, heroSeat=(h.hero_seat!=null)?h.hero_seat:0;
  // Refresh the serial -> live-Pokémon map the hover tooltip reads; reset tipKey so a stationary
  // cursor re-reads the new step's data instead of showing the previous step's stale live values.
  LIVE={}; tipKey=null;
  if(g) for(const pl of g.players) for(const m of [...(pl.active||[]), ...(pl.bench||[])]) if(m) LIVE[m.serial]=m;
  // Count by VISIBLE ordinal so stepping increments 1,2,3… (no confusing "step 1 → step 5" jump);
  // keep the raw step index too for cross-referencing the trace.
  const visIdx=STEPS.map((_,i)=>i).filter(visible), ord=visIdx.indexOf(cur);
  $("#counter").textContent=`${ord>=0?ord+1:"–"} / ${visIdx.length} shown · step ${cur+1}/${STEPS.length} · turn ${s.turn}`;
  renderScrub(visIdx);
  const dtype = sel? (sel.policy?["policy","policy"]:sel.learnable?["multi","multi-select"]:["auto","auto"]) : ["auto","—"];

  let html = (SESSION?sessionBar():"") + `<div class="card" id="result"><div class="banner"><b>${esc(h.result_str)}</b>
      · ended by <b>${esc(h.win_mode.mode)}</b> on turn ${h.win_mode.turns}
      (p0 prize-diff ${h.win_mode.prize_diff>=0?"+":""}${h.win_mode.prize_diff})</div>
      <div class="meta">p0 = ${esc(h.p0)} · p1 = ${esc(h.p1)} · ${STEPS.length} decisions · commit ${esc(h.git_commit)}</div></div>`;

  // Board (hero at the bottom regardless of which seat it drew this game)
  const gfx=$("#gfx").checked;
  $("#wrap").classList.toggle("boardfocus", gfx);   // graphic board → full-width single-column layout
  html += `<div class="card"><h2>Board ${gfx?"· graphic ":""}${reveal?"(hidden info revealed)":"(model's fog-of-war)"}</h2>`;
  if(g){ const oppSeat=1-heroSeat, ts=s.actor_seat;
    html += gfx ? gBoard(g,heroSeat,ts,reveal)
                : side(g,oppSeat,false,ts===oppSeat,reveal) + side(g,heroSeat,true,ts===heroSeat,reveal);
  } else html += `<div class="meta">no board snapshot</div>`;
  html += `</div>`;

  // Decision
  html += `<div class="card"><h2>Decision <span class="badge ${dtype[0]}">${dtype[1]}</span></h2>`;
  html += `<div class="meta">${s.actor_name} acting (seat ${s.actor_seat})${s.hero_move?" · HERO":""}</div>`;
  if(sel){
    html += `<div class="prompt">${esc(sel.prompt)}</div>
      <div class="meta">${esc(sel.type_name)} · pick ${sel.minCount}${sel.maxCount!==sel.minCount?"–"+sel.maxCount:""} of ${sel.n_options}</div>`;
    // Explain the absence of probability bars rather than leaving it a mystery:
    //  · a non-learnable node was auto-resolved (forced single option / must-pick-all / NUMBER-count),
    //    so the policy never ran — true for any actor;
    //  · a learnable node with no recorded model = the actor isn't an introspectable SB3 model
    //    (rule-based / random / legacy MCTS), so no per-option probs exist.
    if(sel.learnable===false){
      const n=s.options.length;
      html += `<div class="meta" style="color:var(--warn);margin-top:3px">⚙ forced / auto-resolved — model not consulted (${n} legal option${n!==1?"s":""})</div>`;
    } else if(!s.model){
      html += `<div class="meta" style="margin-top:3px">no per-option probabilities — ${esc(s.actor_name)} isn't an introspectable SB3 model</div>`;
    }
    const m=s.model; // Phase 3: {probs:[...], p_commit, value, win_prob}
    html += `<div class="opts">` + s.options.map((o,i)=>{
      const p = m&&m.probs&&m.probs[i]!=null ? m.probs[i] : null;
      const bar = p!=null?`<div class="pbar" style="width:${(p*100).toFixed(0)}%"></div>`:"";
      const pct = p!=null?`<span class="pct">${(p*100).toFixed(0)}%</span>`:"";
      // color the row by the option's card (left stripe + name), matching the board; skip when absent
      const col = cardColor(o.cid);
      const stripe = col?`box-shadow:inset 3px 0 0 0 ${col};`:"";
      const lblStyle = col?` style="color:${col}"`:"";
      return `<div class="opt ${o.chosen?"chosen":""}" style="${stripe}">${bar}<span class="lbl"${lblStyle}>${esc(o.label)}</span>${pct}
        ${o.chosen?`<span class="pick">◄ chose</span>`:""}</div>`;
    }).join("") + `</div>`;
    if(m){
      const wp=Math.round((m.win_prob!=null?m.win_prob:(m.value+1)/2)*100);
      html += `<div class="valwrap">model value read: <b>${m.value.toFixed(2)}</b> ≈ ${wp}% win <i>(approx)</i>
        <div class="valbar"><i style="left:${wp}%"></i></div></div>`;
    }
  } else html += `<div class="meta">deck-selection node</div>`;

  // Collapsible detail panels (toggles keep the screen clean — expand only what you're chasing)
  html += `<div class="panels">`;
  if(s.logs&&s.logs.length){
    html += `<details open><summary>Events into this decision (${s.logs.length})</summary><div class="events body">`
      + s.logs.map(e=>`<div class="ev ${evClass(e)}">${esc(evText(e))}</div>`).join("") + `</div></details>`;
  }
  if(s.features&&s.features.state&&TRACE.header.state_labels){
    html += `<details><summary>Model input features — state (${s.features.state.length} dims)</summary>`
      + `<div class="body">${featPanel(s.features.state,TRACE.header.state_labels)}</div></details>`;
  }
  html += `<details><summary>Raw obs the ${esc(s.actor_name)} saw (fog-of-war)</summary>`
    + `<pre class="obs">${esc(JSON.stringify(s.obs,null,1))}</pre></details>`;
  html += `</div>`;

  html += `</div>`;
  wrap.innerHTML=html;
}

// Session summary bar (only when a session file is loaded): win% + CI + win-modes + a game picker.
function sessionBar(){
  const s=SESSION.session, es=s.end_summary;
  const histo=o=>Object.keys(o||{}).length?Object.entries(o).map(([k,v])=>`${k} ${v}`).join(" · "):"—";
  const opts=SESSION.games.map((gm,i)=>`<option value="${i}"${i===gameIdx?" selected":""}>#${i+1} · ${esc(gm.header.result_str)}</option>`).join("");
  const t=es.turns_mean!=null?es.turns_mean.toFixed(1):"—";
  return `<div class="card" id="session"><h2>Session · ${esc(s.p0)} vs ${esc(s.p1)}</h2>
    <div class="banner">win% <b>${(s.win_pct*100).toFixed(1)}%</b>
      <span class="meta">(95% Wilson CI ${(s.ci_lo*100).toFixed(1)}–${(s.ci_hi*100).toFixed(1)}, n=${s.decisive} decisive)</span>
      · W/L/D <b>${s.wins}/${s.losses}/${s.draws}</b> over ${s.n} games</div>
    <div class="meta">win-modes: ${histo(es.win_modes)} &nbsp;|&nbsp; loss-modes: ${histo(es.loss_modes)}
      &nbsp;|&nbsp; prize-trailing wins ${es.trailing_win_n} &nbsp;|&nbsp; avg turns ${t}</div>
    <div style="margin-top:7px">viewing game
      <select onchange="pickGame(this.value)">${opts}</select></div>
  </div>`;
}

// Group the labeled state vector by side (g / me / opp) into nested collapsibles; nonzero values pop.
function featPanel(vals,labels){
  const groups={};
  for(let i=0;i<labels.length;i++){
    const lb=labels[i], c=lb.indexOf(":"), grp=c<0?"":lb.slice(0,c), det=c<0?lb:lb.slice(c+1).trim();
    (groups[grp]=groups[grp]||[]).push([det,vals[i]]);
  }
  const title={g:"global",me:"my side",opp:"opponent side"};
  return Object.keys(groups).map(grp=>{
    const nz=groups[grp].filter(r=>r[1]!==0).length;
    const rows=groups[grp].map(([d,v])=>`<div class="frow ${v!==0?"nz":""}"><span>${esc(d)}</span><span>${v!==0?`<b>${v}</b>`:v}</span></div>`).join("");
    return `<details class="fgroup"><summary>${esc(title[grp]||grp)} — ${nz}/${groups[grp].length} nonzero</summary>${rows}</details>`;
  }).join("");
}

// Match-progress scrubber: one clickable tick per visible step (from `visIdx`, the raw indices that
// pass the current filters), grouped and labeled by turn. Tick color = who + whether the model ran:
// bright accent = hero decision the policy scored, blue = hero forced/auto move, grey = opponent. The
// current step is outlined. Each group's flex-grow = its tick count, so all ticks are equal width and a
// click near the right edge lands on the last turn. Lives in the sticky #bar, so it's always in reach.
function renderScrub(visIdx){
  const scrub=$("#scrub"); if(!scrub) return;
  if(!visIdx || !visIdx.length){ scrub.innerHTML=""; return; }
  const groups=[];                                   // consecutive visible steps sharing a turn
  for(const i of visIdx){
    const t=STEPS[i].turn, g=groups[groups.length-1];
    if(g && g.turn===t) g.items.push(i); else groups.push({turn:t, items:[i]});
  }
  const legend=`<div class="tlegend" title="tick color = actor + whether the model was consulted">`
    + `<b class="model">▮</b>model <b class="hero">▮</b>hero <b class="opp">▮</b>opp</div>`;
  scrub.innerHTML = legend + groups.map(g=>{
    const ticks=g.items.map(i=>{
      const s=STEPS[i], sel=s.select||{}, who=s.hero_move?"HERO":"opp";
      const cls=s.hero_move?(s.model?"model":"hero"):"opp";
      const tip=`turn ${s.turn} · ${who} · ${esc(sel.prompt||"—")}`;
      return `<div class="tick ${cls}${i===cur?" cur":""}" title="${tip}" onclick="jumpTo(${i})"></div>`;
    }).join("");
    return `<div class="turngrp" style="flex-grow:${g.items.length}" title="turn ${g.turn}">`
      + `<div class="tlabel">T${g.turn}</div><div class="trow">${ticks}</div></div>`;
  }).join("");
}
</script>
